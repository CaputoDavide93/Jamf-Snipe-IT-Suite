name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.lock.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

      - name: Check generated module inventory is current
        run: python tools/gen_modules_doc.py --check

      - name: Diagrams up to date
        run: python3 tools/gen_diagram.py --check

      - name: Brand icon up to date
        run: |
          pip install pillow
          sh tools/brand/check-icon.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      - name: Validate
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image on python 3.15
        run: |
          sed -i 's/python:3.12-slim-trixie/python:3.15-slim-trixie/' Dockerfile
          docker build -t probe .
          docker run --rm --entrypoint python probe -c "import pydantic_core, cryptography, cffi, anthropic, boto3, msal, yaml, requests; print('imports ok')"
